services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: onb
      POSTGRES_PASSWORD: onb
      POSTGRES_DB: onb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onb"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
